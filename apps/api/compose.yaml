services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: birdtie
      POSTGRES_PASSWORD: birdtie_local_only
      POSTGRES_DB: birdtie
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - birdtie_pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./dev-seeds:/dev-seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birdtie -d birdtie"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  birdtie_pgdata:
