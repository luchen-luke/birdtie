  input.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'&&!event.isComposing){event.preventDefault();submit();}});
  content.addEventListener('scroll',()=>{state.scroll=content.scrollTop;root.querySelector('.bt-jump').hidden=!(state.expanded&&content.scrollHeight-content.clientHeight-content.scrollTop>180);});
  root.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!drawer.hidden)closeDrawer();else if(!modal.hidden)closeModal();else if(!social.hidden)closeSocial();else if(!popover.hidden)closePopover();else if(state.voice!=='idle')cancelVoice();else if(state.keyboard){state.keyboard=false;input.blur();updateComposer();}else if(state.expanded){state.expanded=false;renderResult();}}const dialog=!drawer.hidden?drawer:!modal.hidden?modal:null;if(event.key==='Tab'&&dialog){const list=[...dialog.querySelectorAll('button,input,textarea,select,a[href]')].filter(el=>!el.disabled&&!el.hidden);if(!list.length)return;if(event.shiftKey&&document.activeElement===list[0]){event.preventDefault();list.at(-1).focus();}else if(!event.shiftKey&&document.activeElement===list.at(-1)){event.preventDefault();list[0].focus();}}});
  scrim.addEventListener('click',closeModal);
  drawerScrim.addEventListener('click',()=>closeDrawer());
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.voice!=='idle'){cancelVoice();notify('录音已中断，原草稿保留');}});
  function restore(saved){if(!saved?.privateContent||state.voice!=='idle')return;const incoming=saved.privateContent;if((incoming.revision||0)<=uiRevision&&uiRevision>0)return;if(!['map','input','answer','reading','draft','loading','empty','error','mention','attachments','voice','chat','entity'].includes(incoming.scene))return;uiRevision=incoming.revision||0;Object.assign(state,{scene:incoming.scene,expanded:!!incoming.expanded,scroll:incoming.scroll||0,keyboard:!!incoming.keyboard,audience:incoming.audience||'仅自己',recipient:people[incoming.recipient]?incoming.recipient:null,density:incoming.density==='dense'?'dense':'standard',selectedEntity:mapObjects.some(o=>o.id===incoming.selectedEntity)?incoming.selectedEntity:null});if(state.scene==='chat'&&!state.recipient||state.scene==='entity'&&!state.selectedEntity)state.scene='map';renderResult();updateComposer();renderMapObjects();}
  renderResult();updateComposer();restore(window.openai?.widgetState);renderMapObjects();new ResizeObserver(()=>renderMapObjects()).observe(phone);
  window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
  if(globalThis.Tweak){const design={radius:26,text:15};const tweak=new Tweak({container:composer,onChange:()=>{composer.style.borderRadius=design.radius+'px';content.style.fontSize=design.text+'px';}});tweak.addSlider(design,'radius',{label:'输入框圆角',min:18,max:30,unit:'px'});tweak.addSlider(design,'text',{label:'回答字号',min:15,max:18,unit:'px'});}
})();
</script>
