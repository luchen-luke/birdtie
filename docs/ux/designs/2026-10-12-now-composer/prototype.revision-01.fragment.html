#birdtie-now-preview .bt-modal textarea,#birdtie-now-preview .bt-draft textarea {width:100%;background:var(--bt-soft);border:0;border-radius:12px;resize:vertical;padding:12px;font:inherit;font-size:15px;line-height:1.6;color:var(--bt-body);}

#birdtie-now-preview .bt-draft-row>span {color:var(--bt-muted);}
#birdtie-now-preview .bt-draft-row button {padding:10px 0;min-height:48px;}
#birdtie-now-preview .bt-draft-row svg.lucide {width:15px;height:15px;}

#birdtie-now-preview .bt-feedback-title {font-size:16px;color:var(--bt-ink);font-weight:500;margin:14px 0 6px;}
#birdtie-now-preview .bt-feedback-actions {display:flex;align-items:center;gap:10px;margin:12px 0;}
#birdtie-now-preview .bt-toast {position:absolute;top:111px;left:20px;right:20px;z-index:14;max-width:350px;margin:auto;background:var(--bt-ink);color:var(--bt-paper);padding:12px 16px;border-radius:17px;font-size:13px;line-height:1.5;box-shadow:0 5px 15px #17261A18;}
#birdtie-now-preview .bt-jump {height:0;position:relative;z-index:6;}
#birdtie-now-preview .bt-jump .bt-round {position:absolute;left:calc(50% - 24px);bottom:8px;border:1px solid var(--bt-line);}

#birdtie-now-preview .bt-voice-wave span:nth-child(1),#birdtie-now-preview .bt-voice-wave span:nth-child(7) {height:14px;}
#birdtie-now-preview .bt-voice-wave span:nth-child(2),#birdtie-now-preview .bt-voice-wave span:nth-child(6) {height:28px;}
#birdtie-now-preview .bt-voice-wave span:nth-child(3),#birdtie-now-preview .bt-voice-wave span:nth-child(5) {height:42px;}
#birdtie-now-preview .bt-voice-wave span:nth-child(4) {height:55px;}
#birdtie-now-preview ::selection {background:var(--bt-chip);color:var(--bt-ink);}
@keyframes bt-pop {from {transform:translateY(8px);}to {transform:translateY(0);}}
@keyframes bt-pulse {50% {opacity:.35;}}
@media(max-width:440px) {#birdtie-now-preview .bt-stage {padding:12px 0 20px;}#birdtie-now-preview .bt-phone {height:800px;border-radius:24px;}#birdtie-now-preview .bt-preview-head {padding-inline:4px;}#birdtie-now-preview .bt-scenarios {gap:0;}#birdtie-now-preview .bt-scenarios>button {padding-inline:11px;}#birdtie-now-preview .bt-result-content {padding-inline:16px;}#birdtie-now-preview .bt-contact-rail {right:5px;}}
@media(prefers-reduced-motion:reduce) {#birdtie-now-preview *,#birdtie-now-preview *:before {animation:none!important;transition:none!important;}}
</style>
<script>
(() => {
  const root=document.getElementById('birdtie-now-preview');
  const phone=root.querySelector('.bt-phone'), sheet=root.querySelector('.bt-sheet'), content=root.querySelector('.bt-result-content'), input=root.querySelector('#bt-input'), head=root.querySelector('.bt-sheet-head'), tools=root.querySelector('.bt-tools'), composer=root.querySelector('.bt-composer'), popover=root.querySelector('.bt-popover'), modal=root.querySelector('.bt-modal'), scrim=root.querySelector('.bt-modal-scrim'), kb=root.querySelector('.bt-keyboard'), materials=root.querySelector('.bt-materials'), title=root.querySelector('#bt-task-title');
  const state={scene:'map',keyboard:false,expanded:false,query:'',reply:'answer',attachment:false,reference:'',audience:'仅自己',draftPlace:'',draftText:'下午沿着海边走了一会儿，想把这段安静的时光记录下来。',selected:false,scroll:0};
  const textMeasure=document.createElement('canvas').getContext('2d');
  let timer,toastTimer,requestId=0,returnFocus=null;
  const icons=()=>globalThis.lucide?.createIcons({attrs:{width:22,height:22}});
  const icon=name=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
  const escape=text=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const source=(label='地点资料')=>'<button type="button" class="bt-source" data-action="sources">'+icon('globe')+label+'</button>';
  const row=(action,label,symbol,small='')=>'<button type="button" class="bt-menu-row" data-action="'+action+'"><span class="bt-menu-icon">'+icon(symbol)+'</span><span>'+label+(small?'<small>'+small+'</small>':'')+'</span></button>';
  function remember(){window.openai?.setWidgetState?.({modelContent:{design:'BirdTie Now 2026-10-12',scene:state.scene,expanded:state.expanded,audience:state.audience},privateContent:{scene:state.scene,expanded:state.expanded,scroll:state.scroll,keyboard:state.keyboard,audience:state.audience}})?.catch(()=>{});}
  function notify(text){const el=root.querySelector('.bt-toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2600);}
  function closePopover(){popover.hidden=true;popover.innerHTML='';root.querySelector('[data-action=plus]').setAttribute('aria-expanded','false');}
  function openModal(name,body){closePopover();returnFocus=document.activeElement;kb.hidden=true;phone.style.setProperty('--bt-kb','0px');modal.setAttribute('aria-label',name);modal.innerHTML='<div class="bt-modal-header"><h3>'+name+'</h3><button type="button" data-action="dismiss" aria-label="关闭">'+icon('x')+'</button></div>'+body;modal.hidden=false;scrim.hidden=false;sheet.inert=true;root.querySelector('.bt-map').inert=true;root.querySelector('.bt-chrome').inert=true;root.querySelector('.bt-contact-rail').inert=true;root.querySelector('.bt-locate').inert=true;icons();modal.querySelector('button').focus();}
  function closeModal(){modal.hidden=true;scrim.hidden=true;sheet.inert=false;root.querySelector('.bt-map').inert=false;root.querySelector('.bt-chrome').inert=false;root.querySelector('.bt-contact-rail').inert=false;root.querySelector('.bt-locate').inert=false;updateComposer();if(returnFocus?.isConnected)returnFocus.focus();}
  function updateComposer(){
    const text=input.value.trim(),style=getComputedStyle(input);
    textMeasure.font=style.fontWeight+' '+style.fontSize+' '+style.fontFamily;
    const compactWidth=Math.max(40,phone.clientWidth-146),displayText=text||input.placeholder;
    const wraps=textMeasure.measureText(displayText).width>compactWidth;
    const multi=state.keyboard||input.value.includes('\n')||wraps||state.attachment||!!state.reference;
    composer.classList.toggle('is-multiline',multi);phone.classList.toggle('is-editing',state.keyboard);phone.style.setProperty('--bt-kb',state.keyboard?'252px':'0px');kb.hidden=!state.keyboard;
    root.querySelector('.bt-send').hidden=!text&&!state.attachment;
    root.querySelector('.bt-context-mode').hidden=!multi;
    root.querySelector('.bt-mic').hidden=(!multi&&!!text)||state.attachment;
    const currentStyle=getComputedStyle(input),lineHeight=parseFloat(currentStyle.lineHeight),padding=parseFloat(currentStyle.paddingTop)+parseFloat(currentStyle.paddingBottom);
    input.style.maxHeight=(4*lineHeight+padding)+'px';input.style.height='0px';input.style.height=Math.min(4*lineHeight+padding,Math.max(multi?lineHeight+20:lineHeight+padding,input.scrollHeight))+'px';
    materials.hidden=!state.attachment&&!state.reference;
    materials.innerHTML=(state.attachment?'<span class="bt-material-token">'+icon('image')+'演示照片 · 助手暂不读图<button type="button" data-action="remove-image" aria-label="移除照片">'+icon('x')+'</button></span>':'')+(state.reference?'<span class="bt-material-token">'+icon('at-sign')+escape(state.reference)+'<button type="button" data-action="remove-reference" aria-label="移除引用">'+icon('x')+'</button></span>':'');
    icons();
  }
  function mapSelection(on){state.selected=on;root.querySelector('.pin-museum').classList.toggle('is-active',on);}
  function positionPopover(){const bottom=phone.getBoundingClientRect().bottom-composer.getBoundingClientRect().top+8;popover.style.bottom=bottom+'px';popover.style.maxHeight=Math.max(120,phone.clientHeight-bottom-105)+'px';}
  function placeCard(){return '<article class="bt-place-card"><div class="bt-place-title"><div><strong>阿伯丁海事博物馆</strong><small>Aberdeen Maritime Museum</small></div><button type="button" data-action="place-more" aria-label="地点更多操作">'+icon('ellipsis')+'</button></div><p>Shiprow, Aberdeen <span class="bt-quiet-note">· 演示资料</span></p><div class="bt-place-footer"><button type="button" class="bt-main-action" data-action="navigate">'+icon('navigation')+'导航</button>'+source()+'</div></article>';}
  function actions(){return '<div class="bt-result-actions"><button type="button" class="bt-icon-button" data-action="copy" aria-label="复制回答">'+icon('copy')+'</button><button type="button" class="bt-icon-button" data-action="helpful" aria-label="回答有帮助">'+icon('thumbs-up')+'</button><button type="button" class="bt-icon-button" data-action="response-more" aria-label="回答更多操作">'+icon('ellipsis')+'</button>'+source('来源 2')+'</div>';}
  function reading(){return '<div class="bt-user-message">下午想在 Aberdeen 慢慢走走，帮我安排一下</div><p>可以把下午留给<strong>城市中心和海边</strong>，先选两个想停留的地方，再安排顺路的走法。</p><h3>先在城市中心停一停</h3><p>从你方便抵达的位置开始。在地图上看看海事博物馆，也可以把附近想去的地方加入这次计划。这里的地点用于设计演示，营业和开放信息需要在真实查询中核验。'+source()+'</p>'+placeCard()+'<h3>留一些没有安排的时间</h3><p>不必把每一段时间排满。找到喜欢的咖啡馆、停下来拍照，或者临时换一个方向，都可以在同一张地图上继续调整。</p><p>你可以告诉我“少走一点”或“把海边放在最后”，我会把这些条件带入当前计划。改变路线不会丢掉已经选中的地点。</p><h3>路线开始前，确认起点</h3><p>探索城市并不代表你现在就在这里。你想从哪个地方出发？确定起点后，才能估计步行距离和时间。</p><button type="button" class="bt-link-action" data-action="start-point">选择出发地点 '+icon('arrow-right')+'</button><p class="bt-quiet-note">本段为原型演示内容，不是实时行程建议。</p>'+actions();}
  function draft(){return '<div class="bt-draft"><div class="bt-draft-label">动态草稿 · 尚未发布</div><h3>记录此刻</h3><label class="bt-draft-label" for="bt-draft-body">正文</label><textarea id="bt-draft-body" rows="4">'+escape(state.draftText)+'</textarea><div class="bt-draft-row"><span>地点</span><button type="button" data-action="draft-place">'+escape(state.draftPlace||'暂不添加')+' '+icon('chevron-right')+'</button></div><div class="bt-draft-row"><span>谁可以看</span><button type="button" data-action="audience">'+escape(state.audience)+' '+icon('chevron-right')+'</button></div><p class="bt-quiet-note">选择受众后，再检查完整预览。</p><div class="bt-draft-actions"><button type="button" class="bt-link-action" data-action="save-draft">保存草稿</button><button type="button" class="bt-main-action" data-action="preview-draft">预览动态 '+icon('arrow-right')+'</button></div></div>';}
  function renderResult(){
    let html='',label='当前回答';
    const user='<div class="bt-user-message">'+escape(state.query||'海事博物馆在哪里？')+'</div>';
    if(state.scene==='answer')html=user+placeCard();
    if(state.scene==='reading'){html=reading();label='下午的散步计划';}
    if(state.scene==='draft'){html=draft();label='动态草稿';}
    if(state.scene==='loading'){html=user+'<div class="bt-loading"><span></span>正在整理地点资料…</div><button type="button" class="bt-link-action" data-action="cancel-query">停止</button>';label='正在查询';}
    if(state.scene==='empty'){html=user+'<div class="bt-feedback-title">暂时没找到符合条件的地点</div><p>可以换一个关键词，或调整这次查询范围。</p><div class="bt-feedback-actions"><button type="button" class="bt-main-action" data-action="modify-query">修改条件</button><button type="button" class="bt-link-action" data-action="close-result">继续看地图</button></div>';label='查询结果';}
    if(state.scene==='error'){html=user+'<div class="bt-feedback-title">这次查询没有完成</div><p>服务暂时没有响应。你的输入和地图位置已保留。</p><div class="bt-feedback-actions"><button type="button" class="bt-main-action" data-action="retry">重试</button><button type="button" class="bt-link-action" data-action="modify-query">修改输入</button></div>';label='服务暂时不可用';}
    content.innerHTML=html;title.textContent=label;head.hidden=!html;content.hidden=!html;sheet.classList.toggle('has-result',!!html);sheet.classList.toggle('expanded',state.expanded&&!!html);
    root.querySelectorAll('[data-action=expand]').forEach(el=>el.setAttribute('aria-label',state.expanded?'收起阅读':'展开阅读'));
    if(state.expanded)content.scrollTop=state.scroll;else content.scrollTop=0;
    root.querySelector('.bt-locate').hidden=!!html;icons();
  }
  function selectScene(name,save=true){
    clearTimeout(timer);clearTimeout(toastTimer);root.querySelector('.bt-toast').hidden=true;requestId++;closePopover();if(!modal.hidden)closeModal();
    state.scene=name;state.keyboard=['input','mention'].includes(name);state.expanded=['reading','draft'].includes(name);state.scroll=0;
    if(name==='input')input.value='帮我找一个适合下午散步的地方';
    if(name==='mention')input.value='@';
    if(['map','answer','reading','draft','loading','empty','error'].includes(name))input.value='';
    mapSelection(name==='answer'||name==='reading');renderResult();updateComposer();
    root.querySelectorAll('[data-scene]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.scene===name)));
    root.querySelector('#bt-more-scenes').value=['attachments','mention','draft','voice','loading','empty','error'].includes(name)?name:'';
    if(name==='attachments')showMaterials();if(name==='mention')showMentions();if(name==='voice')showVoice();
    if(save)remember();
  }
  function showMaterials(){popover.setAttribute('aria-label','材料与行动');popover.innerHTML='<div class="bt-menu-heading">添加材料</div>'+row('camera','拍照','camera')+row('photo','照片','image')+row('file','文件','paperclip')+'<div class="bt-menu-divider"></div><div class="bt-menu-heading">创建内容</div>'+row('create-moment','动态','square-pen')+row('create-activity','活动','calendar-plus')+row('create-journey','旅程或主题地图','map');popover.hidden=false;root.querySelector('[data-action=plus]').setAttribute('aria-expanded','true');icons();positionPopover();}
  function showMentions(){popover.setAttribute('aria-label','引用上下文');popover.innerHTML='<div class="bt-menu-heading">引用到当前任务</div>'+row('mention-place','海事博物馆','map-pin','地点')+row('mention-person','小林','user-round','好友 · 引用不会发送消息')+row('mention-saved','周末散步清单','bookmark','已保存');popover.hidden=false;icons();positionPopover();}
  function showVoice(){openModal('语音转文字','<p class="bt-quiet-note">原型模拟转写，不使用麦克风。</p><div class="bt-voice-wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><p style="text-align:center">说出你的想法，转写后可以修改。</p><div class="bt-draft-actions"><button type="button" class="bt-link-action" data-action="dismiss">取消</button><button type="button" class="bt-main-action" data-action="finish-voice">停止并查看文字</button></div>');}
  function submit(){
    if(!input.value.trim()&&!state.attachment)return;
    if(state.attachment){state.draftText=input.value.trim()||state.draftText;state.attachment=false;state.reference='';state.audience='仅自己';selectScene('draft');return;}
    state.query=input.value.trim();state.reference='';const planned=/散步|路线|计划|下午/.test(state.query);selectScene('loading');const id=requestId;timer=setTimeout(()=>{if(requestId!==id)return;selectScene(planned?'reading':'answer');},950);
  }
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button)return;
    if(button.dataset.scene){selectScene(button.dataset.scene);return;}
    if(button.dataset.key!==undefined){input.value+=button.dataset.key;state.keyboard=true;updateComposer();if(button.dataset.key==='@')showMentions();return;}
    const action=button.dataset.action;
    if(action==='plus'){if(popover.hidden)showMaterials();else closePopover();}
    else if(action==='send')submit();
    else if(action==='voice')showVoice();
    else if(action==='hide-keyboard'){state.keyboard=false;input.blur();closePopover();updateComposer();remember();}
    else if(action==='close-result'){content.querySelector('#bt-draft-body')&&(state.draftText=content.querySelector('#bt-draft-body').value);state.reply=state.scene;state.scroll=content.scrollTop;state.scene='map';state.expanded=false;state.keyboard=false;renderResult();updateComposer();remember();}
    else if(action==='expand'){if(state.scene==='map'){state.scene=state.reply||'answer';}state.scroll=content.scrollTop;state.expanded=!state.expanded;renderResult();remember();}
    else if(action==='place'){state.query='海事博物馆在哪里？';selectScene('answer');}
    else if(action==='walk'){state.query='下午在 Aberdeen 散步';selectScene('reading');}
    else if(action==='moment'){openModal('小林的动态','<p>海边的风刚刚好。</p><p class="bt-quiet-note">公开动态 · 演示内容</p><button type="button" class="bt-link-action" data-action="create-moment">我也记录此刻 '+icon('arrow-right')+'</button>');}
    else if(action==='camera'||action==='photo'){closePopover();state.attachment=true;state.keyboard=false;updateComposer();notify('已加入一张演示照片，可补充文字再继续');}
    else if(action==='file'){openModal('添加文件','<p>在这里先检查文件名称和用途，再加入当前任务。</p>'+row('select-demo-file','散步计划.pdf','file-text','演示文件 · 不会读取本机文件'));}
    else if(action==='select-demo-file'){closeModal();state.reference='散步计划.pdf';state.keyboard=false;updateComposer();notify('演示文件已加入当前上下文');}
    else if(action==='remove-image'){state.attachment=false;updateComposer();}
    else if(action==='remove-reference'){state.reference='';updateComposer();}
    else if(action?.startsWith('mention-')){state.reference=action==='mention-person'?'小林':action==='mention-place'?'海事博物馆':'周末散步清单';input.value=input.value.replace(/@[^\s]*$/,'');closePopover();updateComposer();notify('仅引用到当前任务，不会发送或通知');remember();}
    else if(action==='create-moment'){state.attachment=false;selectScene('draft');}
    else if(action==='create-activity'){openModal('活动草稿','<p>先整理活动目标，再补必要信息。</p><label for="bt-activity">你想组织什么？</label><textarea id="bt-activity" rows="3" placeholder="例如：周六下午一起逛博物馆"></textarea><button type="button" class="bt-main-action" data-action="activity-continue">整理草稿</button>');}
    else if(action==='activity-continue'){const value=modal.querySelector('textarea').value.trim();if(!value){modal.querySelector('textarea').focus();return;}closeModal();input.value=value;state.keyboard=true;updateComposer();notify('活动目标已填入输入框，发送后继续完善草稿');}
    else if(action==='create-journey'){openModal('旅程或主题地图',row('journey-draft','规划一段旅程','route')+row('theme-draft','整理主题地图','map-pinned'));}
    else if(action==='journey-draft'||action==='theme-draft'){closeModal();input.value=action==='journey-draft'?'帮我规划一段旅程':'把选中的地点整理成主题地图';state.keyboard=true;updateComposer();}
    else if(action==='sources'){openModal('资料来源','<p>来源只对应当前回答中的相关事实。</p>'+row('source-detail','地点资料示例','globe','原型演示 · 无实时查询')+row('source-detail','你提供的条件','message-square','本次任务输入'));}
    else if(action==='source-detail'){notify('原型使用演示资料；正式页面打开对应出处与核验状态');}
    else if(action==='navigate'||action==='start-point'){openModal('选择出发地点','<p>探索 Aberdeen 不代表你的实际位置。先确定这次路线的起点。</p>'+row('pick-start','从地图选择地点','map-pin')+row('location-permission','使用当前位置','locate-fixed','需本人授权'));}
    else if(action==='pick-start'){closeModal();state.query='从地图上选择的地点开始，帮我规划散步路线';selectScene('reading');notify('演示起点已选；真实路线需核验坐标与交通方式');}
    else if(action==='location-permission'||action==='locate'){openModal('定位授权','<p>定位只用于你明确选择的当前任务。切换探索城市不会公开你的位置。</p><button type="button" class="bt-main-action" data-action="dismiss">继续使用探索城市</button>');}
    else if(action==='place-more'){openModal('地点操作',row('save-place','收藏地点','bookmark')+row('share-place','分享地点','share-2')+row('sources','查看来源','globe'));}
    else if(action==='save-place'){closeModal();notify('原型演示：已收藏这个地点');}
    else if(action==='share-place'){openModal('分享地点','<p>只分享所选地点，不附带 Now 私人对话。</p>'+row('share-preview','选择好友','users-round'));
    }
    else if(action==='share-preview'){openModal('发送预览','<p>收件人：小林（演示）</p><p>内容：阿伯丁海事博物馆地点卡</p><p class="bt-quiet-note">这是发送前的预览，尚未发送。</p><button type="button" class="bt-main-action" data-action="mock-send">向小林发送地点</button>');}
    else if(action==='mock-send'){closeModal();notify('原型演示完成；未发送真实消息');}
    else if(action==='audience'){openModal('谁可以看',row('audience-self','仅自己','lock')+row('audience-friends','好友','users-round')+row('audience-public','公开','globe'));}
    else if(action?.startsWith('audience-')){state.audience=action==='audience-self'?'仅自己':action==='audience-friends'?'好友':'公开';closeModal();state.draftText=content.querySelector('#bt-draft-body')?.value||state.draftText;renderResult();remember();}
    else if(action==='preview-draft'){state.draftText=content.querySelector('#bt-draft-body').value;openModal('动态预览','<p>'+escape(state.draftText)+'</p><p>受众：<strong>'+escape(state.audience)+'</strong></p><p>地点：'+escape(state.draftPlace||'未添加')+'</p><p class="bt-quiet-note">尚未发布。确认后才产生你选择的可见效果。</p><div class="bt-draft-actions"><button type="button" class="bt-link-action" data-action="dismiss">返回修改</button><button type="button" class="bt-main-action" data-action="mock-publish">'+(state.audience==='仅自己'?'保存为仅自己可见':'向'+state.audience+'发布')+'</button></div>');}
    else if(action==='mock-publish'){closeModal();notify('已演示确认流程；没有保存或发布到真实账号');}
    else if(action==='save-draft'){state.draftText=content.querySelector('#bt-draft-body').value;remember();notify('演示草稿已保留，可继续编辑');}
    else if(action==='draft-place'){openModal('选择动态地点','<p>照片中的地点需要本人核实。当前草稿没有添加位置。</p>'+row('draft-place-demo','海事博物馆','map-pin','演示地点')+row('dismiss','暂不添加地点','x'));}
    else if(action==='draft-place-demo'){state.draftPlace='海事博物馆 · 演示';state.draftText=content.querySelector('#bt-draft-body')?.value||state.draftText;closeModal();renderResult();notify('已添加演示地点，可在预览中检查');}
    else if(action==='finish-voice'){closeModal();input.value='帮我找一个下午可以安静散步的地方';state.keyboard=true;updateComposer();notify('模拟文字已填入，可修改后手动发送');}
    else if(action==='copy'){notify('已演示复制反馈');}
    else if(action==='helpful'){button.setAttribute('aria-pressed','true');notify('已记录本次演示反馈');}
    else if(action==='response-more'){openModal('回答操作',row('modify-query','继续修改条件','square-pen')+row('close-result-modal','回到地图','map'));}
    else if(action==='close-result-modal'){closeModal();selectScene('map');}
    else if(action==='modify-query'){if(!modal.hidden)closeModal();input.value=state.query||'海事博物馆在哪里？';state.keyboard=true;updateComposer();input.focus();}
    else if(action==='retry'){selectScene('loading');const id=requestId;timer=setTimeout(()=>{if(id===requestId)selectScene('answer');},950);}
    else if(action==='cancel-query'){clearTimeout(timer);requestId++;selectScene('map');input.value=state.query;updateComposer();notify('查询已停止，输入已保留');}
    else if(action==='sidebar'){openModal('会话与导航',row('resume-task','下午的散步计划','message-square','继续上次阅读')+row('new','新对话','square-pen')+'<div class="bt-menu-divider"></div>'+row('inbox','消息','inbox')+row('plans','我的计划','calendar-days')+row('settings','我的与设置','user-round'));}
    else if(action==='resume-task'){closeModal();state.scene='reading';state.expanded=true;renderResult();updateComposer();}
    else if(action==='new'){selectScene('map');state.query='';state.attachment=false;state.reference='';updateComposer();notify('已打开一段新的演示对话');}
    else if(action==='city'){openModal('选择城市',row('select-city','Aberdeen','map-pin','英国 · 当前探索城市')+'<p class="bt-quiet-note">仅切换探索城市，不改变你的定位。</p>');}
    else if(action==='select-city'){closeModal();notify('当前探索城市为 Aberdeen');}
    else if(action==='contacts'||action==='contact'){openModal('联系人',row('contact-context','小林','user-round','查看好友或引用到当前任务')+row('contact-context','阿澈','user-round','演示联系人'));}
    else if(action==='contact-context'){closeModal();state.reference='小林';state.keyboard=false;updateComposer();}
    else if(action==='inbox'){openModal('消息与通知','<p>人与人消息与 Agent 任务分别呈现。</p>'+row('dismiss','小林的消息','message-circle','演示会话')+row('dismiss','活动事项','calendar','演示通知'));}
    else if(action==='plans'){openModal('我的计划','<p>任务完成后，可以从这里找回同一份计划。</p>'+row('resume-task','下午的散步计划','route','原型演示'));}
    else if(action==='settings'){openModal('我的与设置',row('dismiss','个人资料','user-round')+row('dismiss','隐私与 AI 授权','shield-check'));}
    else if(action==='context'){notify('本次探索上下文：Aberdeen；不是设备实时位置');}
    else if(action==='jump'){content.scrollTo({top:content.scrollHeight,behavior:'smooth'});}
    else if(action==='dismiss')closeModal();
  });
  root.querySelector('#bt-more-scenes').addEventListener('change',event=>{if(event.target.value)selectScene(event.target.value);});
  input.addEventListener('focus',()=>{if(modal.hidden&&!state.keyboard){state.keyboard=true;updateComposer();}});
  input.addEventListener('input',()=>{updateComposer();if(/@[^\s]*$/.test(input.value))showMentions();else if(popover.getAttribute('aria-label')==='引用上下文')closePopover();});
  input.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'&&!event.isComposing){event.preventDefault();submit();}});
  content.addEventListener('scroll',()=>{state.scroll=content.scrollTop;root.querySelector('.bt-jump').hidden=!(state.expanded&&content.scrollHeight-content.clientHeight-content.scrollTop>180);});
  root.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!modal.hidden)closeModal();else if(!popover.hidden)closePopover();else if(state.keyboard){state.keyboard=false;input.blur();updateComposer();}else if(state.expanded){state.expanded=false;renderResult();}}if(event.key==='Tab'&&!modal.hidden){const list=[...modal.querySelectorAll('button,input,textarea,select,a[href]')].filter(el=>!el.disabled&&!el.hidden);if(!list.length)return;if(event.shiftKey&&document.activeElement===list[0]){event.preventDefault();list.at(-1).focus();}else if(!event.shiftKey&&document.activeElement===list.at(-1)){event.preventDefault();list[0].focus();}}});
  scrim.addEventListener('click',closeModal);
  function restore(saved){if(!saved?.privateContent)return;const incoming=saved.privateContent;if(!['map','input','answer','reading','draft','loading','empty','error','mention','attachments','voice'].includes(incoming.scene))return;Object.assign(state,{scene:incoming.scene,expanded:!!incoming.expanded,scroll:incoming.scroll||0,keyboard:!!incoming.keyboard,audience:incoming.audience||'仅自己'});renderResult();updateComposer();}
  renderResult();updateComposer();restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
  if(globalThis.Tweak){const design={radius:26,text:15};const tweak=new Tweak({container:composer,onChange:()=>{composer.style.borderRadius=design.radius+'px';content.style.fontSize=design.text+'px';}});tweak.addSlider(design,'radius',{label:'输入框圆角',min:18,max:30,unit:'px'});tweak.addSlider(design,'text',{label:'回答字号',min:15,max:18,unit:'px'});}
})();
</script>
